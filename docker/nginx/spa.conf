# Shared nginx server block for the two single-page web UIs of the root Compose project
# (heka-identity-service-web-ui, heka-sso-web-ui). Copied into each image as
# /etc/nginx/conf.d/default.conf. Serves the static bundle and answers every unknown path
# with index.html so client-side routes survive a reload.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The entry point is never cached: it references the hashed bundle names of the current build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles (webpack contenthash, vite hash) may be cached for a long time.
    location ~* \.(js|css|woff2?|ttf|png|jpg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
