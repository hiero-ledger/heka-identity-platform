// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 28
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        androidXBrowser = "1.5.0"
        javaVersion = JavaVersion.VERSION_17
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        jcenter()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../../node_modules/jsc-android/dist")
        }

        google()
        maven { url 'https://www.jitpack.io' }
    }
}

allprojects { project ->
    if (project.name in ["animo-id-expo-digital-credentials-api", "animo-id-expo-secure-environment"]) {
        project.ext.set("react.internal.disableJavaVersionAlignment", "true")
    }
}

subprojects {
    // Fix for NDK 27 C++ compatibility issues with native modules
    afterEvaluate { project ->
        ["com.android.application", "com.android.library"].each { pluginId ->
            project.plugins.withId(pluginId) {
                project.android {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
            }
        }

        project.plugins.withId("com.android.library") {
            project.android {
                if (project.android.hasProperty("externalNativeBuild")) {
                    project.android.defaultConfig {
                        externalNativeBuild {
                            cmake {
                                cppFlags "-std=c++17"
                                arguments "-DCMAKE_CXX_STANDARD=17"
                            }
                        }
                    }
                }
            }
        }
    }
}

project(':app') {
    dependencyLocking {
        lockAllConfigurations()
    }
}
