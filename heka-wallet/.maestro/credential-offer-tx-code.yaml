appId: com.heka.wallet
name: SD-JWT credential offer with a transaction code asks for the code, then is accepted
tags:
  - backend
env:
  PIN: '482916'
---
- runFlow: subflows/onboard.yaml
- runScript:
    file: scripts/create-sd-jwt-offer.js
    env:
      TX_CODE_LENGTH: '6'
- openLink: ${output.offerDeepLink}
- runFlow: subflows/choose-heka-wallet.yaml
# The code is asked for while the offer screen still loads: the credential is requested only after it.
- extendedWaitUntil:
    visible: 'Please enter credential PIN'
    timeout: 30000
- tapOn: 'Code'
- inputText: ${output.txCode}
# Submit from the keyboard: while it is open, a tap on Confirm only closes it (the modal's ScrollView keeps no taps)
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Credential Offer'
    timeout: 30000
# Accept is below the credential details.
- scrollUntilVisible:
    element:
      id: 'com.ariesbifold:id/AcceptCredentialOffer'
- tapOn:
    id: 'com.ariesbifold:id/AcceptCredentialOffer'
- extendedWaitUntil:
    visible:
      id: 'com.ariesbifold:id/CredentialOfferDone'
    timeout: 30000
- tapOn:
    id: 'com.ariesbifold:id/CredentialOfferDone'
- extendedWaitUntil:
    visible:
      id: 'com.ariesbifold:id/TabCredentials'
    timeout: 15000
# The stored credential's card on Home is labelled with its vct and issuer.
- assertVisible: 'Https://example.com/maestro-e2e.*'
