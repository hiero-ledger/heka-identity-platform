appId: com.heka.wallet
name: SD-JWT credential offer from identity-service is accepted
tags:
  - backend
env:
  PIN: '482916'
---
- runFlow: subflows/onboard.yaml
- runScript: scripts/create-sd-jwt-offer.js
- openLink: ${output.offerDeepLink}
- runFlow: subflows/choose-heka-wallet.yaml
- extendedWaitUntil:
    visible: 'Credential Offer'
    timeout: 30000
# Accept is below the credential details.
- scrollUntilVisible:
    element:
      id: 'com.ariesbifold:id/AcceptCredentialOffer'
- tapOn:
    id: 'com.ariesbifold:id/AcceptCredentialOffer'
- extendedWaitUntil:
    visible:
      id: 'com.ariesbifold:id/CredentialOfferDone'
    timeout: 30000
- tapOn:
    id: 'com.ariesbifold:id/CredentialOfferDone'
- extendedWaitUntil:
    visible:
      id: 'com.ariesbifold:id/TabCredentials'
    timeout: 15000
# The stored credential's card on Home is labelled with its vct and issuer.
- assertVisible: 'Https://example.com/maestro-e2e.*'
