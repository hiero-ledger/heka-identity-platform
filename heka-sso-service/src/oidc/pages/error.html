<!DOCTYPE html>
<!--
  Provider error page - rendered by the library's renderError hook.
  {{details}} is the pre-escaped list of OAuth error fields the library deems
  safe to show; stack traces never reach this page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in error</title>
<link rel="stylesheet" href="/interaction/assets/styles.css">
</head>
<body>
<header class="top-bar">
  <div class="brand">
    <img src="/interaction/assets/logo.svg" alt="">
    <span class="brand-name">Heka</span>
  </div>
</header>
<main>
<div class="card">
<h1>Sign-in error</h1>
<p class="muted">The sign-in request could not be processed.</p>
<dl>
{{details}}
</dl>
</div>
</main>
</body>
</html>
