services:
  postgres:
    image: postgres:15
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=heka
      - POSTGRES_PASSWORD=heka1
      - POSTGRES_DB=heka-sso-service
  # P1.7 demo: Keycloak with the pre-configured `heka` realm (IdP `heka-sso`
  # against the bridge — PKCE S256, JWKS signature validation, 15s clock skew,
  # attribute mappers; client `heka-sso-web-ui` for the test RP). Server-side
  # calls (token/jwks/userinfo) reach the bridge on the host via
  # host.docker.internal; browser-facing URLs stay on localhost:3005.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    # Dev flags: no theme caching, so a rebuilt heka-keycloak-theme jar shows
    # after a container restart without clearing caches (UI-PLAN.md Phase K).
    command: start-dev --import-realm --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Login theme (realm-heka.json sets loginTheme: heka). Build it once:
      #   cd ../heka-keycloak-theme && yarn build-keycloak-theme
      - ../heka-keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/heka-theme.jar:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  heka-sso-service:
    image: heka-sso-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_VERSION=0.0.1
      - APP_PORT=3005
      - APP_ENABLE_CORS=true
      - LOG_LEVEL=trace
      - LOG_EXCLUDE_URLS=/version,/health
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=heka-sso-service
      - DB_USER=heka
      - DB_PASSWORD=heka1
      - OIDC_ISSUER_URL=http://localhost:3005
      - OIDC_COOKIE_KEYS=dev-only-cookie-key-do-not-use-in-production
      - OIDC_SUB_HMAC_SALT=dev-only-sub-hmac-salt-do-not-use-in-production
      - IDENTITY_SERVICE_BASE_URL=http://localhost:3000
      - OIDC_CLIENTS=[{"clientId":"keycloak-broker","clientSecret":"dev-only-broker-secret-do-not-use-in-production","redirectUris":["http://localhost:8080/realms/heka/broker/heka-sso/endpoint","http://localhost:8080/realms/master/broker/heka-sso/endpoint"],"postLogoutRedirectUris":["http://localhost:8080/realms/heka/broker/heka-sso/endpoint/logout_response","http://localhost:8080/realms/master/broker/heka-sso/endpoint/logout_response"],"loginConfigId":"default"}]
      - OIDC_LOGIN_CONFIGS=[{"id":"default","verificationTemplate":"default","claimMapping":{"mdl.given_name":"given_name","mdl.family_name":"family_name","mdl.age_over_18":"age_over_18"},"subStrategy":"derived","issuerAllowlist":[]}]
      # Dev-only stub login (INTEGRATION.md P1.3) — refused in production
      - OIDC_STUB_LOGIN=true
    ports:
      - '3005:3005'
    depends_on:
      - postgres
