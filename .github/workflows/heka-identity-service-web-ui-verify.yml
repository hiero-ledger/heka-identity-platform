name: Verify Heka Identity Service Web UI changes

on:
  pull_request:
    branches:
      - main
    paths:
      - 'heka-identity-service-web-ui/**'
      - '.github/workflows/heka-identity-service-web-ui-verify.yml'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    defaults:
      run:
        working-directory: ./heka-identity-service-web-ui
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repository
      contents: read
      # Required by vitest-coverage-report-action to post the coverage comment
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Prepare Github Runner
        uses: pandaswhocode/initialize-github-job@74303607c68fe88ff9b7bfc05c40ca948fa04b13 # v1.5.0
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        shell: bash

      - name: Run build (App)
        run: yarn build:prod

      - name: Run build (Storybook)
        run: yarn storybook:build

      - name: Run ESLint
        run: yarn lint:ts

      - name: Run Stylelint
        run: yarn lint:scss

      # Also enforces the coverageThreshold floors in config/jest/jest.config.ts
      - name: Run tests
        run: yarn test:coverage

      # Jest writes the same Istanbul JSON reports (json-summary, json) that this action reads
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: Identity Service Web UI
          working-directory: ./heka-identity-service-web-ui
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
