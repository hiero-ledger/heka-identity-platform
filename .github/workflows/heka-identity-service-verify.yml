name: Verify Heka Identity Service changes

on:
  pull_request:
    branches:
      - main
    paths:
      - 'heka-identity-service/**'
      - 'heka-sso-service/keycloak/realm-heka-platform.json'
      - '.github/workflows/heka-identity-service-verify.yml'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    defaults:
      run:
        working-directory: ./heka-identity-service
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repository
      contents: read
      # Required by vitest-coverage-report-action to post the coverage comment
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: heka-identity-service
          POSTGRES_USER: heka
          POSTGRES_PASSWORD: heka1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare Github Runner
        uses: pandaswhocode/initialize-github-job@0ed960ecaed898893e404ad55c7aa12fdc3b2a53 # v1.4.0
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable
        shell: bash

      - name: Install dependencies
        run: yarn install --immutable
        shell: bash

      - name: Run typecheck
        run: yarn check-types

      - name: Run ESLint
        run: yarn lint-check

      - name: Run tests
        env:
          FORCE_COLOR: 1
          NODE_OPTIONS: --max-old-space-size=6144
          MIKRO_ORM_HOST: localhost
          MIKRO_ORM_PORT: 5432
          MIKRO_ORM_USER: heka
          MIKRO_ORM_PASSWORD: heka1
          WALLET_POSTGRES_HOST: localhost
          EXPRESS_HOST: localhost
          FILE_STORAGE_FS_URL: http://localhost:3000
          APP_ENDPOINT: http://localhost:3000
        run: yarn test:coverage

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          working-directory: ./heka-identity-service
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  # Optional: bearer-token verification against a real Keycloak running the shipped `heka-platform`
  # realm (discovery, JWKS, iss/aud, claim mapping) with tokens its service-account clients issue.
  # Informational only (continue-on-error): a Keycloak image or import hiccup must not block a PR.
  keycloak-live:
    name: Token verification against Keycloak
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./heka-identity-service

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Prepare Github Runner
        uses: pandaswhocode/initialize-github-job@ffb7446339e8e6007b942312ac95457d1a20b6cf # v1.0.4
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '22'

      - name: Start Keycloak with the platform realm
        working-directory: ./heka-sso-service
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME=http://localhost:8080 \
            -v "$PWD/keycloak/realm-heka-platform.json:/opt/keycloak/data/import/realm-heka-platform.json:ro" \
            quay.io/keycloak/keycloak:26.3 start-dev --import-realm
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/heka-platform/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak is up"; exit 0
            fi
            sleep 3
          done
          echo "Keycloak did not come up"; docker logs keycloak; exit 1
        shell: bash

      - name: Enable Corepack
        run: corepack enable
        shell: bash

      - name: Install dependencies
        run: yarn install --immutable
        shell: bash

      - name: Verify Keycloak-issued tokens
        env:
          FORCE_COLOR: 1
          KEYCLOAK_LIVE_URL: http://localhost:8080
        run: yarn vitest run test/keycloak-live.test.ts

      - name: Keycloak logs
        if: failure()
        run: docker logs keycloak
