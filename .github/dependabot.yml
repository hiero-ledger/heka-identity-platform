version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/heka-auth-service"
      - "/heka-identity-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
