<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heka page (Web Wallet harness)</title>
  </head>
  <body>
    <h1>Heka page (Web Wallet harness)</h1>
    <p>Served on a trusted Heka origin, so the extension's content script runs here.</p>
    <script>
      // The same messages the web UI's contributor onboarding exchanges with the bridge
      // (heka-identity-service-web-ui/src/pages/Contributor/Onboarding).
      window.__events = []
      window.addEventListener('message', (event) => {
        if (event.data && event.data.source === 'heka-extension-bridge') {
          window.__events.push({ origin: event.origin, type: event.data.type, payload: event.data.payload })
        }
      })
      window.sendBridge = (type, payload) =>
        window.postMessage({ source: 'heka-web-wallet-bridge', type, payload }, window.location.origin)
    </script>
  </body>
</html>
